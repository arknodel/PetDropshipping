<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Good Leash Co. — Coming soon</title>
  <meta name="description" content="Good Leash Co.: practical everyday products for dog and cat parents. Coming soon.">
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #fbf7f1; --ink: #2b2a28; --muted: #6b665e; --accent: #c8643b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1c1a; --ink: #f3efe8; --muted: #b3ada3; --accent: #e08a62; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 24px 16px;
    }
    main { max-width: 34rem; text-align: center; }
    .mark { font-size: 2.5rem; margin-bottom: .25rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    p { margin: 0 0 1rem; color: var(--muted); }
    .pill {
      display: inline-block; margin-top: .5rem; padding: .35rem .9rem;
      border: 1px solid currentColor; border-radius: 999px;
      color: var(--accent); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🐾</div>
    <h1>Good Leash <span>Co.</span></h1>
    <p>Practical, everyday products for dog and cat parents — picked to solve the little problems that come with sharing your home with pets.</p>
    <span class="pill">Coming soon</span>
  </main>
</body>
</html>
