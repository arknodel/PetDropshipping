name: deploy
# Builds the Astro site in /site from /data and publishes to GitHub Pages.
# Site origin/base come from configure-pages, so the same build works on
# arknodel.github.io/PetDropshipping and on the custom domain.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/deploy.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      # deploy-pages sometimes can't see a just-uploaded artifact ("Fetching artifact
      # metadata failed"). Retry once after a pause instead of failing the run.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
